<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../pagoda.png">
  <title>Мнемоключи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
.example { font-size: 1.5rem; }
.key-images img { width: 160px; max-width: 100%; height: auto; border: 2px solid #aaa; border-radius: 2px; background: #ddd; }
.key-images div + div { margin-top: .25rem; }
.key-symbols { min-width: 5rem; }

@media (max-width: 767px) {
  #key_table, #key_table tbody { display: block; width: 100%; }
  #key_table thead { display: none; }
  #key_table tr {
    display: grid;
    grid-template-columns: auto fit-content(35%) minmax(0, 1fr);
    gap: .5rem;
    align-items: center;
    margin-bottom: 1rem;
    padding: .75rem;
    border: 1px solid var(--bs-border-color);
    border-radius: .5rem;
  }
  #key_table tr > * {
    min-width: 0;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }
  #key_table tr:nth-of-type(odd) { background: var(--bs-tertiary-bg); }
  #key_table .key-symbols { display: flex; flex-wrap: wrap; align-items: center; }
  #key_table .key-images {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: .25rem;
  }
  #key_table .key-images div { min-width: 0; margin: 0; }
  #key_table .key-images img { width: 144px; }
  #key_table td:last-child { grid-column: 1 / -1; overflow-wrap: anywhere; }
}


span:lang(vi) {
    font-family: 'Nom Na Tong', 'HAN NOM A', 'HAN NOM B', 
	Sun-ExtA, Sun-ExtB, Ming-Lt-HKSCS-UNI-H, Ming-Lt-HKSCS-ExtB, 
	HanaMinA, HanaMinB, HanaMin, 'PingFang TC', 
	MingLiU, MingLiU-ExtB, 'MingLiU_HKSCS', 'MingLiU_HKSCS-ExtB', 
	SimSun, SimSun-ExtB, 'Arial Unicode MS', 'TITUS Cyberbit Basic', sans-serif;
}

span:lang(zh-Hant) {
    font-family:  
	SimSun, SimSun-ExtB, 'Arial Unicode MS', 'TITUS Cyberbit Basic', sans-serif;
}

  </style>
</head>

  <header class="container">
	  <nav aria-label="breadcrumb">

		<li class="breadcrumb-item active" aria-current="page">Мнемоключи</li>
	  </ol>
	</nav>
  </header>
  
  <main class="container">
  <h1>Список мнемоключей системы</h1>
  
  	<figure class="figure">
	  <img src="../images/headers/item_hodgepodge2.jpg" class="figure-img img-fluid rounded " 
	    alt="Ключи системы">
	  <figcaption class="figure-caption text-sm-end ">Фантасмагория ключей может показаться сеттингом исекая</figcaption>
	</figure>
	
    <p>Cписок всех ключей в системе c комментариями и пояснениями. 
	   Как ими пользоваться, сказано в <a href="desc/keys.html">разделе ключей</a>
	</p>

	<table class="table table-sm table-striped" id="key_table">
	  <thead>
	    <tr>
		  <th scope="col">№</th>
		  <th scope="col">Радикал</th>
		  <th scope="col">Картинка</th>
		  <th scope="col">Мнемоключ, комментарии и примеры</th>
		</tr>
	  </thead>
	  <tbody>
{{ rows }}
	  </tbody>
	</table>
	
  </main>
</body>
